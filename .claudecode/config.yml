# Configuración Base para Claude Code - Proyecto R-Exams ICFES
# Sistema Operativo: Manjaro Plasma (Arch-based)
# Entorno: RStudio + R-exams + LaTeX (XeLaTeX)

project_name: "RepositorioMatematicasICFES_R_Exams"
base_path: "/home/bootcamp/Proyectos-2026/RepositorioMatematicasICFES_R_Exams"
reference_doc: ".claudedoc/guia_estilo_icfes.md"

# Rutas de referencia
paths:
  examples: "A-Produccion/Ejemplos-Funcionales-Rmd"
  rules: "Auxiliares/rules_full/reglas-generales.md"
  output: "A-Produccion"

# Configuración de herramientas
tools:
  r:
    executable: "/usr/bin/Rscript"
    engine: "R"
  python:
    executable: "/usr/bin/python3"
    engine: "python"
  latex:
    engine: "xelatex"
    packages_required:
      - tikz
      - pgfplots
      - babel
      - amsmath
      - fontspec
      - unicode-math

# Validaciones automáticas
validation:
  pre_commit: true
  yaml_syntax: true
  latex_escape: true
  icfes_metadata: true
  chunk_structure: true

# Configuración de agentes
agents:
  default:
    temperature: 0.1
    model: "claude-3-5-sonnet-20241022"
  validator:
    temperature: 0.0
    model: "claude-3-5-sonnet-20241022"
  fixer:
    temperature: 0.2
    model: "claude-3-5-sonnet-20241022"
