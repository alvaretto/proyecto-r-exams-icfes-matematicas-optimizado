<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de estilos -->
  <defs>
    <style>
      .solid-line {
        stroke: black;
        stroke-width: 2;
        fill: none;
      }
      .dashed-line {
        stroke: black;
        stroke-width: 1.5;
        stroke-dasharray: 5,5;
        fill: none;
      }
      .label {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  <!-- Figura izquierda (Prisma OPQR) -->
  <!-- Base inferior -->
  <line x1="50" y1="200" x2="120" y2="200" class="solid-line"/>
  <line x1="120" y1="200" x2="150" y2="150" class="solid-line"/>
  <line x1="150" y1="150" x2="80" y2="150" class="solid-line"/>
  <line x1="80" y1="150" x2="50" y2="200" class="solid-line"/>
  
  <!-- Aristas verticales -->
  <line x1="50" y1="200" x2="80" y2="100" class="solid-line"/>
  <line x1="120" y1="200" x2="150" y2="100" class="solid-line"/>
  <line x1="150" y1="150" x2="180" y2="50" class="solid-line"/>
  <line x1="80" y1="150" x2="110" y2="50" class="solid-line"/>
  
  <!-- Base superior -->
  <line x1="80" y1="100" x2="150" y2="100" class="solid-line"/>
  <line x1="150" y1="100" x2="180" y2="50" class="solid-line"/>
  <line x1="180" y1="50" x2="110" y2="50" class="solid-line"/>
  <line x1="110" y1="50" x2="80" y2="100" class="solid-line"/>
  
  <!-- Etiquetas figura izquierda -->
  <text x="45" y="210" class="label">O</text>
  <text x="125" y="210" class="label">P</text>
  <text x="155" y="140" class="label">Q</text>
  <text x="185" y="40" class="label">R</text>
  
  <!-- Figura derecha (Prisma EFGH) -->
  <!-- Base inferior -->
  <line x1="250" y1="180" x2="320" y2="180" class="solid-line"/>
  <line x1="320" y1="180" x2="350" y2="130" class="solid-line"/>
  <line x1="350" y1="130" x2="280" y2="130" class="solid-line"/>
  <line x1="280" y1="130" x2="250" y2="180" class="solid-line"/>
  
  <!-- Aristas verticales -->
  <line x1="250" y1="180" x2="280" y2="80" class="solid-line"/>
  <line x1="320" y1="180" x2="350" y2="80" class="solid-line"/>
  <line x1="350" y1="130" x2="380" y2="30" class="solid-line"/>
  <line x1="280" y1="130" x2="310" y2="30" class="solid-line"/>
  
  <!-- Base superior -->
  <line x1="280" y1="80" x2="350" y2="80" class="solid-line"/>
  <line x1="350" y1="80" x2="380" y2="30" class="solid-line"/>
  <line x1="380" y1="30" x2="310" y2="30" class="solid-line"/>
  <line x1="310" y1="30" x2="280" y2="80" class="solid-line"/>
  
  <!-- Etiquetas figura derecha -->
  <text x="245" y="190" class="label">E</text>
  <text x="285" y="140" class="label">F</text>
  <text x="315" y="20" class="label">G</text>
  <text x="385" y="20" class="label">H</text>
  
  <!-- Línea punteada diagonal conectora -->
  <line x1="80" y1="120" x2="280" y2="100" class="dashed-line"/>
  
  <!-- Etiqueta k en la línea conectora -->
  <text x="180" y="105" class="label">k</text>
  
</svg>
