# CI/CD Pipeline para Testing Continuo
# Ejecuta la suite completa de tests llamando al runner único (run_all_tests.R).
# Esto garantiza una sola fuente de verdad: lo que corre en local = lo que corre en CI.

name: CI Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Ejecutar tests diariamente a las 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  tests-full:
    runs-on: ubuntu-latest
    name: Suite completa (run_all_tests.R)

    steps:
    - uses: actions/checkout@v4

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-latex-recommended \
          texlive-pictures \
          pandoc \
          imagemagick \
          libmagick++-dev \
          ghostscript \
          poppler-utils \
          python3-numpy \
          python3-matplotlib
        # exams::include_tikz() compila con tikz/colortbl/xcolor y convierte el
        # PDF resultante a imagen. Sin texlive-pictures no hay tikz.sty, y la
        # politica por defecto de ImageMagick en Ubuntu prohibe leer PDF, lo que
        # rompe esa conversion aunque LaTeX haya compilado bien.
        for pol in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
          if [ -f "$pol" ]; then
            sudo sed -i 's|<policy domain="coder" rights="none" pattern="PDF" */>|<policy domain="coder" rights="read\|write" pattern="PDF" />|' "$pol"
          fi
        done


    - name: Install R dependencies
      run: |
        install.packages(c(
          "exams", "testthat", "knitr", "rmarkdown", "tinytex",
          "jsonlite", "digest", "stringr", "xml2",
          # Requeridos por las suites de graficos y por los .Rmd con Python:
          # su ausencia dejaba en rojo a "Distintividad Visual" (ggplot2) y a
          # "CLOZE N3 (Trigonometria)" (reticulate).
          "ggplot2", "png", "reticulate",
          # Usados por los .Rmd que renderizan las suites de regresion y CLOZE N3.
          "dplyr", "magick"
        ))
      shell: Rscript {0}

    - name: Registrar el texmf de R en TEXINPUTS
      run: |
        # exams compila sus .tex con \usepackage{Sweave}, y Sweave.sty lo aporta
        # la instalacion de R, no texlive. En una distro el paquete de R deja ese
        # .sty dentro del arbol texmf del sistema; aqui setup-r instala R bajo
        # /opt/R/<version>, cuyo texmf LaTeX no conoce -> "File `Sweave.sty' not
        # found" y las suites con include_tikz() caen en bloque.
        # Ojo: "Rscript -e" arrastra todo lo que el .Rprofile del repo imprime al
        # arrancar, asi que sustituirlo dentro de $(...) devuelve esa parrafada
        # ademas de la ruta. "R RHOME" no carga perfiles.
        R_HOME_DIR="$(R RHOME)"
        echo "R.home(): $R_HOME_DIR"
        SWEAVE="$(find "$R_HOME_DIR" -name Sweave.sty -print -quit)"
        if [ -z "$SWEAVE" ]; then
          echo "::error::No se encontro Sweave.sty bajo $R_HOME_DIR"
          exit 1
        fi
        echo "Sweave.sty: $SWEAVE"
        echo "TEXINPUTS=.:$(dirname "$SWEAVE")//:" >> "$GITHUB_ENV"

    - name: Diagnostico LaTeX (no bloqueante)
      continue-on-error: true
      run: |
        echo "--- .sty requeridos por include_tikz ---"
        for sty in tikz colortbl xcolor standalone preview; do
          printf '%-12s %s\n' "$sty" "$(kpsewhich $sty.sty || echo AUSENTE)"
        done
        echo "--- politica PDF de ImageMagick ---"
        (convert -list policy 2>/dev/null | grep -A2 -i pdf || echo "sin politica PDF explicita")
        echo "--- reproduccion minima de include_tikz, con log de LaTeX ---"
        cat > /tmp/probe_tikz.R <<'EOF'
        options(tinytex.verbose = TRUE)
        tikz <- "\\begin{tikzpicture}\\draw (0,0) -- (1,1);\\end{tikzpicture}"
        for (fmt in c("pdf", "png")) {
          cat("\n### format =", fmt, "\n")
          r <- tryCatch(
            exams::include_tikz(tikz, name = paste0("probe_", fmt),
                                markup = "markdown", format = fmt,
                                packages = c("tikz", "colortbl", "xcolor"),
                                width = "3cm"),
            error = function(e) paste("ERROR:", conditionMessage(e)))
          cat(r, "\n")
        }
        EOF
        Rscript /tmp/probe_tikz.R 2>&1 | tail -80

    - name: Run full test suite
      run: Rscript tests/run_all_tests.R

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/testthat/
