# CI/CD Pipeline para Testing Continuo
# Ejecuta la suite completa de tests llamando al runner único (run_all_tests.R).
# Esto garantiza una sola fuente de verdad: lo que corre en local = lo que corre en CI.

name: CI Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Ejecutar tests diariamente a las 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  tests-full:
    runs-on: ubuntu-latest
    name: Suite completa (run_all_tests.R)

    steps:
    - uses: actions/checkout@v4

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          pandoc \
          imagemagick \
          python3-numpy \
          python3-matplotlib

    - name: Install R dependencies
      run: |
        install.packages(c(
          "exams", "testthat", "knitr", "rmarkdown", "tinytex",
          "jsonlite", "digest", "stringr", "xml2",
          # Requeridos por las suites de graficos y por los .Rmd con Python:
          # su ausencia dejaba en rojo a "Distintividad Visual" (ggplot2) y a
          # "CLOZE N3 (Trigonometria)" (reticulate).
          "ggplot2", "png", "reticulate"
        ))
      shell: Rscript {0}

    - name: Run full test suite
      run: Rscript tests/run_all_tests.R

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/testthat/
